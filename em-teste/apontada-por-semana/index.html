<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produção Apontada por Semana</title>
<link rel="icon" href="assets/img/consilos-logo-c.png">
<style>
  /* Fontes do projeto producao-encerrada (referencia so leitura; sem elas, cai no sistema). */
  @font-face { font-family:'Barlow'; font-weight:400; font-display:swap;
    src:url("assets/fonts/barlow-400.woff2") format('woff2'); }
  @font-face { font-family:'Barlow'; font-weight:600; font-display:swap;
    src:url("assets/fonts/barlow-600.woff2") format('woff2'); }
  @font-face { font-family:'Barlow Condensed'; font-weight:500; font-display:swap;
    src:url("assets/fonts/barlow-condensed-500.woff2") format('woff2'); }
  @font-face { font-family:'Barlow Condensed'; font-weight:600; font-display:swap;
    src:url("assets/fonts/barlow-condensed-600.woff2") format('woff2'); }
  @font-face { font-family:'Barlow Condensed'; font-weight:700; font-display:swap;
    src:url("assets/fonts/barlow-condensed-700.woff2") format('woff2'); }
  @font-face { font-family:'Oswald'; font-weight:200 700; font-display:swap;
    src:url("assets/fonts/oswald-variable.woff2") format('woff2'); }

  :root {
    --ink:#1A1A1A; --accent:#C8102E; --paper:#fff; --line:#D9D5CD;
    --setor-0:#F6D3AD; --setor-1:#BDD7EE; --setor-2:#D5E8D4; --setor-3:#FFF2CC;
    --setor-4:#E1D5E7; --setor-5:#CFEAE6; --setor-6:#F8CECC; --setor-7:#E0E0E0; --setor-8:#EDE3D2;
    --tinta-num:#1F4E79;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:#F4F1EC; color:var(--ink);
    font-family:'Barlow','Segoe UI',Arial,sans-serif; font-size:14px; }
  .report { max-width:1920px; margin:0 auto; }

  /* Cabeçalho padronizado com o projeto Produção Apontada */
  header.head { background:var(--ink); color:#F4F1EC; padding:6px 16px; display:flex;
    align-items:center; gap:14px; border-bottom:4px solid var(--accent); flex-wrap:wrap; margin-bottom:1px; }
  header.head img { height:22px; width:auto; object-fit:contain; display:block;
    filter:brightness(0) invert(1); flex:none; }
  .head-title { flex:1; min-width:220px; }
  .head-title h1 { margin:0; font-family:'Oswald','Barlow Condensed',sans-serif; font-weight:700;
    font-size:22px; letter-spacing:.01em; text-transform:uppercase; color:#fff; }
  .head-range { text-align:right; flex:none; color:#fff; }
  .head-range .lbl { font-family:'Barlow Condensed',sans-serif; font-weight:500; font-size:12px;
    letter-spacing:.08em; text-transform:uppercase; opacity:.85; }
  .head-range .val { font-family:'Oswald','Barlow Condensed',sans-serif; font-weight:600;
    font-size:14px; margin-top:2px; }
  .head-range .per { font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:13px;
    margin-top:1px; letter-spacing:.02em; }

  .segmento { display:inline-flex; border:1px solid #fff; border-radius:5px; overflow:hidden; flex:none; }
  .seg-btn { border:0; background:transparent; color:#fff; cursor:pointer;
    font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:14px; letter-spacing:.06em;
    text-transform:uppercase; padding:7px 15px; }
  .seg-btn + .seg-btn { border-left:1px solid #fff; }
  .seg-btn.ativo { background:var(--accent); color:#fff; }
  .seg-btn:disabled { opacity:.4; cursor:not-allowed; }

  .tabela-caixa { position:relative; overflow-x:auto; border:1px solid var(--ink); background:#fff; }
  table.painel { border-collapse:separate; border-spacing:0; width:100%; }
  table.painel th, table.painel td { border-right:1px solid #fff; border-bottom:1px solid #fff;
    padding:2px 7px; white-space:nowrap; }

  tr.faixa-titulo th { background:var(--accent); color:#fff; font-family:'Barlow Condensed',sans-serif;
    font-weight:700; font-size:16px; letter-spacing:.03em; text-align:center; padding:6px 10px; text-transform:uppercase; }
  tr.faixa-cab th { background:#6B6B6B; color:#fff; font-family:'Barlow Condensed',sans-serif;
    font-weight:700; font-size:14px; letter-spacing:.04em; text-align:center; padding:4px 8px; }
  tr.faixa-cab th .sub { display:block; font-weight:600; font-size:12px; letter-spacing:0; opacity:.95; }

  th.c-setor, td.c-setor { position:sticky; left:0; z-index:8; width:150px; min-width:150px; }
  th.c-centro, td.c-centro { position:sticky; left:150px; z-index:8; width:230px; min-width:230px; }
  td.c-setor { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px;
    letter-spacing:.02em; text-align:center; vertical-align:middle; }
  td.c-centro { font-weight:600; font-size:14px; text-align:left; }

  td.num { text-align:center; font-size:14px; font-weight:600; color:var(--tinta-num); min-width:84px; }
  td.num.zero { color:var(--tinta-num); }
  td.c-tot { font-weight:700; color:var(--ink); background:#F2EEE6; }
  th.c-tot { background:#4D4D4D; }
  /* Expander da pintura: abre as sub-linhas FAB 01 / FAB 02, distintas por cor */
  .pint-toggle { border:0; background:transparent; cursor:pointer; color:var(--ink);
    font-size:12px; line-height:1; padding:0 2px; vertical-align:middle; }
  td.pint-sub-lab { font-weight:700; padding-left:22px; }
  table.painel tbody tr.pint-sub td { font-size:13px; }
  table.painel tbody tr.pint-maq td { background:var(--setor-4); }   /* cor da pintura, como no painel original */

  /* Consumido / Expedido como LINHAS abaixo do Total Geral */
  table.painel tfoot tr.linha-consumido td { border-top:2px solid #000; }  /* separa do Total Geral */
  table.painel tfoot tr.linha-consumido td { background:#D8C9A8; }
  table.painel tfoot tr.linha-expedido td { background:#C3D9B8; }

  tr.s0 { --fundo:var(--setor-0); } tr.s1 { --fundo:var(--setor-1); } tr.s2 { --fundo:var(--setor-2); }
  tr.s3 { --fundo:var(--setor-3); } tr.s4 { --fundo:var(--setor-4); } tr.s5 { --fundo:var(--setor-5); }
  tr.s6 { --fundo:var(--setor-6); } tr.s7 { --fundo:var(--setor-7); } tr.s8 { --fundo:var(--setor-8); }
  table.painel tbody td { background:var(--fundo); }
  table.painel tbody tr:hover td.num, table.painel tbody tr:hover td.c-centro { background:#C4C4C4; }

  table.painel tfoot td { background:#8C8C8C; color:#000; font-weight:700; font-size:14px;
    border-top:2px solid #fff; text-align:center; }
  table.painel tfoot td.c-rot { font-family:'Barlow Condensed',sans-serif; letter-spacing:.04em;
    text-transform:uppercase; position:sticky; left:0; z-index:8; }
  table.painel tfoot td.tot-geral { background:#6B6B6B; }
</style>
</head>
<body>
<div class="report">
  <header class="head">
    <img src="assets/img/consilos-logo.png" alt="Consilos">
    <div class="head-title"><h1>Produção Apontada por Semana · Fábrica 01</h1></div>
    <div class="segmento" id="segMedida" role="group" aria-label="Medida do peso">
      <button type="button" class="seg-btn ativo" data-medida="apontado">Peso apontado</button>
      <button type="button" class="seg-btn" data-medida="processado">OP's encerradas</button>
    </div>
    <div class="segmento" id="segVisual" role="group" aria-label="Visualizar peso ou quantidade de itens">
      <button type="button" class="seg-btn ativo" data-visual="peso">Peso (kg)</button>
      <button type="button" class="seg-btn" data-visual="quantidade">Itens</button>
    </div>
    <div class="head-range">
      <div class="lbl">Últimas 12 semanas ISO</div>
      <div class="val" id="periodo">&hellip;</div>
      <div class="per" id="gerado"></div>
    </div>
  </header>

  <div class="tabela-caixa">
    <table class="painel" id="tabela">
      <thead id="cabeca"></thead>
      <tbody id="corpo"></tbody>
      <tfoot id="rodape"></tfoot>
    </table>
  </div>
</div>

<script>
(function () {
  var D = window.DADOS_SEMANAS;
  var Q = window.DADOS_QUANTIDADES;
  var nfQtd = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 });
  var nf0 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  var SETOR_ORDEM = ['ESTAMPARIA DE CHAPA','ESTAMPARIA DE PERFIL','USINAGEM','LINHA DE SOLDA',
    'LINHA DE PINTURA','LINHA DE MONTAGEM','TERCEIRIZAÇÃO','FÁBRICA 2','OUTROS'];
  function classeSetor(nome) { var i = SETOR_ORDEM.indexOf(nome); return 's' + (i < 0 ? 8 : i); }

  var semanas = D.semanas;                 // [{ss,n,ini,fim}]
  var ultima = semanas[semanas.length - 1];
  document.getElementById('periodo').textContent = semanas[0].ini + ' a ' + ultima.fim;
  document.getElementById('gerado').textContent = 'Semanas ' + semanas[0].n + ' a ' + ultima.n
    + '/2026 · dados de ' + D.gerado;

  // ── Cabeçalho (fixo: setor, centro, semanas, total) ──
  var cab = document.getElementById('cabeca');
  var trTit = el('tr', 'faixa-titulo');
  var thTit = el('th', null, 'Produção Apontada por Centro de Trabalho — por Semana');
  thTit.colSpan = 3 + semanas.length;   // setor, centro, semanas, total
  trTit.append(thTit); cab.append(trTit);

  var trCab = el('tr', 'faixa-cab');
  trCab.append(el('th', 'c-setor', 'Setor'));
  trCab.append(el('th', 'c-centro', 'Centro de Trabalho'));
  semanas.forEach(function (s) {
    var th = el('th');
    th.append(document.createTextNode('SEM ' + s.n));
    th.append(el('span', 'sub', s.ini + '–' + s.fim));
    trCab.append(th);
  });
  trCab.append(el('th', 'c-tot', 'Total'));
  cab.append(trCab);

  var corpo = document.getElementById('corpo');
  var rod = document.getElementById('rodape');
  var estado = { medida: 'apontado', visual: 'peso', pintAberto: false };
  function dadosAtuais() { return estado.visual === 'quantidade' ? Q : D; }
  function numero(v) { return (estado.visual === 'quantidade' ? nfQtd : nf0).format(v); }

  function ehPintura(setor, centro) { return setor === 'LINHA DE PINTURA' && /PINTURA/i.test(centro); }
  // O centro da pintura numa medida (apontado/processado), para as sub-linhas.
  function pinturaDe(medida) {
    var M = dadosAtuais()[medida]; if (!M) return null;
    var bloco = (M.setores || []).find(function (s) { return s.setor === 'LINHA DE PINTURA'; });
    if (!bloco) return null;
    return bloco.centros.find(function (c) { return /PINTURA/i.test(c.centro); }) || bloco.centros[0] || null;
  }
  // Linha de números (semanas + total) a partir de um objeto {porSemana,total}.
  function celulasSemana(tr, obj) {
    semanas.forEach(function (s) {
      var v = obj ? (obj.porSemana[s.ss] || 0) : 0;
      tr.append(el('td', 'num' + (v ? '' : ' zero'), v ? numero(v) : '·'));
    });
    tr.append(el('td', 'num c-tot', numero(obj ? obj.total : 0)));
  }

  // ── Desenha o corpo e o total para a medida escolhida ──
  function desenhar() {
    var medida = estado.medida;
    var M = dadosAtuais()[medida];
    thTit.textContent = estado.visual === 'quantidade'
      ? 'Quantidade de Itens por Centro de Trabalho — por Semana'
      : 'Produção Apontada por Centro de Trabalho — por Semana';
    document.getElementById('gerado').textContent = 'Semanas ' + semanas[0].n + ' a ' + ultima.n
      + '/2026 · dados de ' + dadosAtuais().gerado;
    corpo.replaceChildren();
    M.setores.forEach(function (bloco) {
      bloco.centros.forEach(function (linha, idx) {
        var tr = el('tr', classeSetor(bloco.setor));
        var pint = ehPintura(bloco.setor, linha.centro);
        var maqs = pint ? (M.pinturaMaquinas || []) : [];
        if (idx === 0) {
          var tdSetor = el('td', 'c-setor', bloco.setor);
          // Pintura aberta: a célula do setor cobre a linha + uma sub-linha por máquina.
          tdSetor.rowSpan = bloco.centros.length + (pint && estado.pintAberto ? maqs.length : 0);
          tr.append(tdSetor);
        }
        var tdCentro = el('td', 'c-centro', linha.centro);
        if (pint) {
          var btn = el('button', 'pint-toggle', estado.pintAberto ? '▾' : '▶');
          btn.type = 'button';
          btn.title = 'Apontado × encerrado da pintura';
          btn.setAttribute('aria-expanded', estado.pintAberto ? 'true' : 'false');
          btn.addEventListener('click', function (ev) { ev.stopPropagation(); estado.pintAberto = !estado.pintAberto; desenhar(); });
          tdCentro.append(document.createTextNode(' '), btn);
        }
        tr.append(tdCentro);
        celulasSemana(tr, linha);
        corpo.append(tr);
        // Sub-linhas da pintura: uma por MÁQUINA (recurso), cada uma por cor — como no painel principal.
        if (pint && estado.pintAberto) {
          maqs.forEach(function (mq) {
            var sub = el('tr', 'pint-sub pint-maq');
            sub.append(el('td', 'c-centro pint-sub-lab', mq.maquina));
            celulasSemana(sub, mq);
            corpo.append(sub);
          });
        }
      });
    });
    rod.replaceChildren();
    // Linha do rodapé: rótulo (colspan 2) + um valor por semana + total. `classe` pinta a linha.
    function linhaRodape(rotulo, porSemana, total, classe) {
      var tr = el('tr', classe);
      var tdRot = el('td', 'c-rot', rotulo);
      tdRot.colSpan = 2;
      tr.append(tdRot);
      semanas.forEach(function (s) { tr.append(el('td', null, numero(porSemana[s.ss] || 0))); });
      tr.append(el('td', 'tot-geral', numero(total)));
      return tr;
    }
    rod.append(linhaRodape('Total Geral', M.totalPorSemana, M.totalGeral, 'linha-total'));
    rod.append(linhaRodape('Consumido', M.consumidoPorSemana, M.totalConsumido, 'linha-consumido'));
    rod.append(linhaRodape('Expedido', M.expedidoPorSemana, M.totalExpedido, 'linha-expedido'));
  }

  // ── Botão apontado × processado ──
  var seg = document.getElementById('segMedida');
  if (!D.temProcessado) {
    seg.querySelector('[data-medida="processado"]').disabled = true;
    seg.querySelector('[data-medida="processado"]').title = 'Sem o dado de processado nesta geração';
  }
  seg.addEventListener('click', function (ev) {
    var btn = ev.target.closest('.seg-btn');
    if (!btn || btn.disabled) return;
    seg.querySelectorAll('.seg-btn').forEach(function (b) { b.classList.toggle('ativo', b === btn); });
    estado.medida = btn.dataset.medida;
    desenhar();
  });

  var segVisual = document.getElementById('segVisual');
  if (!Q) {
    segVisual.querySelector('[data-visual="quantidade"]').disabled = true;
    segVisual.querySelector('[data-visual="quantidade"]').title = 'Dados de itens indisponíveis';
  }
  segVisual.addEventListener('click', function (ev) {
    var btn = ev.target.closest('.seg-btn');
    if (!btn || btn.disabled) return;
    segVisual.querySelectorAll('.seg-btn').forEach(function (b) { b.classList.toggle('ativo', b === btn); });
    estado.visual = btn.dataset.visual;
    seg.querySelector('[data-medida="apontado"]').textContent = estado.visual === 'quantidade' ? 'Itens apontados' : 'Peso apontado';
    desenhar();
  });

  desenhar();
})();
</script>
